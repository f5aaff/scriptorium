name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache: true
          cache-dependency-path: src/backend/go.sum

      - name: Verify frontend lockfile
        run: |
          pwd
          ls -la
          ls -la src/frontend/frontend/package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/src/frontend/frontend/package-lock.json


      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check Go formatting
        run: |
          files=$(find src/backend -name '*.go' -print0 | xargs -0 gofmt -l)

          if [ -n "$files" ]; then
            echo "The following Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run backend tests
        run: make test

      - name: Check frontend
        run: make frontend-check

      - name: Run frontend tests
        run: cd src/frontend/frontend && npm test

      - name: Build all distributions
        run: make build

      - name: Assemble release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release

          cp -a dist/browser release/
          cp -a dist/desktop release/

          cp README.md release/
          cp SECURITY.md release/
          cp .env.example release/

          cat > release/INSTALL.txt <<'EOF'
          Scriptorium - Linux x86-64

          Contents:
            browser/      Browser/server distribution
            desktop/      Desktop application
            README.md     Documentation
            SECURITY.md   Security and deployment guidance
            .env.example  Example configuration

          Browser/server installation:

            cd browser
            chmod +x scriptorium
            ./scriptorium

          Desktop installation:

            Run the executable supplied in the desktop directory.

          Configure the application using environment variables.
          See README.md and .env.example for details.

          SQLite FTS5 is included in the application build;
          no external SQLite installation is required.

          For network access, use an HTTPS reverse proxy and follow
          the security guidance in SECURITY.md.
          EOF

          tar -czf "scriptorium-linux-amd64-${GITHUB_REF_NAME}.tar.gz" \
            -C release .

          sha256sum "scriptorium-linux-amd64-${GITHUB_REF_NAME}.tar.gz" \
            > SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            scriptorium-linux-amd64-${{ github.ref_name }}.tar.gz
            SHA256SUMS
